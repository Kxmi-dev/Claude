# Baut das BK-Scoreboard als Windows-Programm (.exe) und legt es fertig gepackt in
# Kegelbillaird/Anwendungsfertig/BK-Scoreboard-Windows.zip ab.
# Läuft automatisch bei jeder Programmänderung und kann unter "Actions" auch von Hand gestartet werden.
name: Windows-Programm bauen

on:
  push:
    paths:
      - "Kegelbillaird/**"
      - "!Kegelbillaird/Anwendungsfertig/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Kegelbillaird
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: python -m pip install -r requirements.txt pyinstaller pyflakes

      - name: Code prüfen (pyflakes)
        run: python -m pyflakes .

      - name: Selbsttest und .exe erstellen
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python build_exe.py

      - name: Programmordner packen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Anwendungsfertig | Out-Null
          $zip = "Anwendungsfertig/BK-Scoreboard-Windows.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path dist/BK-Scoreboard -DestinationPath $zip -CompressionLevel Optimal
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "ZIP-Größe: $mb MB"
          if ($mb -gt 95) { throw "ZIP ist größer als 95 MB – GitHub erlaubt höchstens 100 MB pro Datei." }
          $commit = "${{ github.sha }}".Substring(0, 7)
          $stamp = Get-Date -Format "dd.MM.yyyy HH:mm"
          @"
          BK-Scoreboard – fertiges Windows-Programm
          ==========================================
          Gebaut am $stamp (UTC) aus Stand $commit.

          1. BK-Scoreboard-Windows.zip herunterladen (auf GitHub die Datei anklicken, dann "Download").
          2. ZIP entpacken, z. B. nach C:\BK-Scoreboard (nicht nach C:\Programme).
          3. BK-Scoreboard.exe doppelklicken. Python wird NICHT benötigt.

          Update einer bestehenden Installation: nur BK-Scoreboard.exe und den Ordner _internal ersetzen.
          einstellungen.json, config.py, sounds, bilder, data, results und logs bleiben erhalten.

          Hinweis: Windows SmartScreen kann beim ersten Start warnen ("Unbekannter Herausgeber").
          Dann "Weitere Informationen" -> "Trotzdem ausführen".
          "@ -replace '(?m)^          ', '' | Set-Content -Encoding utf8 Anwendungsfertig/LIESMICH.txt

      - name: Ins Repository hochladen
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Anwendungsfertig
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Keine Änderung"; exit 0 }
          git commit -m "Anwendungsfertig: Windows-Programm neu gebaut"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
