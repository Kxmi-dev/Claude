# Baut das BK-Scoreboard als Windows-Programm (.exe).
# Startet NUR von Hand: auf GitHub unter "Actions" -> "Windows-Programm bauen" -> "Run workflow"
# (oder per gh workflow run). Das Ergebnis liegt als ZIP-Download beim Lauf (30 Tage),
# es wird nichts ins Repository geschrieben.
name: Windows-Programm bauen

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Kegelbillaird
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: python -m pip install -r requirements.txt pyinstaller pyflakes

      - name: Code prüfen (pyflakes)
        run: python -m pyflakes bk tests main.py config.py build_exe.py

      - name: Selbsttest und .exe erstellen
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python build_exe.py

      - name: LIESMICH beilegen
        shell: pwsh
        run: |
          $commit = "${{ github.sha }}".Substring(0, 7)
          $stamp = Get-Date -Format "dd.MM.yyyy HH:mm"
          @"
          BK-Scoreboard – fertiges Windows-Programm
          ==========================================
          Gebaut am $stamp (UTC) aus Stand $commit.

          1. ZIP entpacken, z. B. nach C:\BK-Scoreboard (nicht nach C:\Programme).
          2. BK-Scoreboard.exe doppelklicken. Python wird NICHT benötigt.

          Update einer bestehenden Installation: nur BK-Scoreboard.exe und den Ordner _internal ersetzen.
          einstellungen.json, config.py, sounds, bilder, vereinslogo, data, results und logs bleiben erhalten.

          Hinweis: Windows SmartScreen kann beim ersten Start warnen ("Unbekannter Herausgeber").
          Dann "Weitere Informationen" -> "Trotzdem ausführen".
          "@ -replace '(?m)^          ', '' | Set-Content -Encoding utf8 dist/BK-Scoreboard/LIESMICH.txt

      - name: Als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: BK-Scoreboard-Windows
          path: Kegelbillaird/dist/BK-Scoreboard
          retention-days: 30
          if-no-files-found: error
